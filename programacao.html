<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programação de Conteúdo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080808; --surface: #111; --surface2: #181818; --border: #222;
      --green: #22c55e; --yellow: #eab308; --blue: #3b82f6; --purple: #a855f7;
      --red: #ef4444; --muted: #666; --muted2: #333; --text: #f0f0f0; --teal: #14b8a6;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 40px 20px 80px; }
    .wrapper { max-width: 900px; margin: 0 auto; }

    /* Header */
    .top { margin-bottom: 32px; }
    .brand { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    h1 { font-size: 26px; font-weight: 800; letter-spacing: -.03em; margin-bottom: 20px; }

    /* Channel selector */
    .channel-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; }
    .ch-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 18px; border-radius: 100px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--muted); font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: 'Inter', sans-serif;
      transition: all .15s;
    }
    .ch-btn:hover { border-color: #444; color: var(--text); }
    .ch-btn.active { color: #000; border-color: transparent; }
    .ch-btn.c1.active { background: var(--text); }
    .ch-btn.c1s.active { background: var(--teal); color: #000; }
    .ch-btn.c2v.active { background: var(--purple); color: #fff; }
    .ch-btn.c2l.active { background: var(--blue); color: #fff; }
    .ch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .c1 .ch-dot  { background: var(--text); }
    .c1s .ch-dot { background: var(--teal); }
    .c2v .ch-dot { background: var(--purple); }
    .c2l .ch-dot { background: var(--blue); }
    .ch-btn.active .ch-dot { background: rgba(255,255,255,.5); }
    .ch-btn.c1.active .ch-dot { background: #000; }

    /* Stats */
    .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 32px; }
    .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 18px; text-align: center; min-width: 80px; }
    .stat-num { font-size: 22px; font-weight: 800; letter-spacing: -.03em; margin-bottom: 2px; }
    .stat-label { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }

    /* Phase label */
    .phase-label {
      font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin: 24px 0 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .phase-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* Cards */
    .grid { display: flex; flex-direction: column; gap: 8px; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px 18px; display: grid; grid-template-columns: 52px 1fr auto;
      gap: 14px; align-items: center; cursor: pointer; position: relative; overflow: hidden;
      transition: border-color .15s;
    }
    .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 14px 0 0 14px; }
    .card.done    { border-color: #16a34a30; } .card.done::before    { background: var(--green); }
    .card.editing { border-color: #ca930030; } .card.editing::before { background: var(--yellow); }
    .card.awaiting { border-color: #14b8a630; } .card.awaiting::before { background: var(--teal); }
    .card.scheduled { border-color: #3b82f630; } .card.scheduled::before { background: var(--blue); }
    .card.pending { border-color: var(--border); } .card.pending::before { background: var(--muted2); }
    .card:hover { border-color: #3a3a3a; }

    .week-num {
      width: 52px; height: 52px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; flex-shrink: 0; text-align: center; line-height: 1.2;
    }
    .card.done     .week-num { background: #16a34a20; color: var(--green); }
    .card.editing  .week-num { background: #ca930020; color: var(--yellow); }
    .card.awaiting .week-num { background: #14b8a620; color: var(--teal); }
    .card.scheduled .week-num { background: #3b82f620; color: var(--blue); }
    .card.pending  .week-num { background: var(--muted2); color: var(--muted); }

    .card-body { min-width: 0; }
    .card-category { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
    .card-title { font-size: 14px; font-weight: 600; line-height: 1.35; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { display: flex; gap: 10px; flex-wrap: wrap; }
    .meta-item { font-size: 12px; color: var(--muted); }

    .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 100px; white-space: nowrap; }
    .badge.done      { background: #16a34a20; color: var(--green);  border: 1px solid #16a34a40; }
    .badge.editing   { background: #ca930020; color: var(--yellow); border: 1px solid #ca930040; }
    .badge.awaiting  { background: #14b8a620; color: var(--teal);   border: 1px solid #14b8a640; }
    .badge.scheduled { background: #3b82f620; color: var(--blue);   border: 1px solid #3b82f640; }
    .badge.pending   { background: var(--muted2); color: var(--muted); border: 1px solid #333; }
    .pub-date { font-size: 12px; color: var(--muted); }

    /* Detail */
    .card-detail { display: none; grid-column: 1 / -1; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 14px; }
    .card.open .card-detail { display: block; }
    .detail-label { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .detail-section { margin-bottom: 14px; }
    .detail-text { font-size: 13px; color: #bbb; line-height: 1.7; }
    .ref-links { display: flex; flex-wrap: wrap; gap: 8px; }
    .ref-link { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--blue); background: #3b82f610; border: 1px solid #3b82f630; border-radius: 8px; padding: 5px 10px; text-decoration: none; transition: background .15s; }
    .ref-link:hover { background: #3b82f620; }
    .status-toggle { display: flex; gap: 6px; flex-wrap: wrap; }
    .toggle-btn { font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: 100px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-family: 'Inter', sans-serif; transition: all .15s; }
    .toggle-btn:hover { border-color: #555; color: var(--text); }
    .toggle-btn.active-done      { background: #16a34a20; color: var(--green);  border-color: #16a34a40; }
    .toggle-btn.active-awaiting  { background: #14b8a620; color: var(--teal);   border-color: #14b8a640; }
    .toggle-btn.active-editing   { background: #ca930020; color: var(--yellow); border-color: #ca930040; }
    .toggle-btn.active-scheduled { background: #3b82f620; color: var(--blue);   border-color: #3b82f640; }
    .toggle-btn.active-pending   { background: var(--muted2); color: var(--muted); border-color: #444; }

    @media (max-width: 580px) {
      .card { grid-template-columns: 44px 1fr; }
      .card-right { display: none; }
      .card-title { white-space: normal; }
    }

    /* Editor panel toggle */
    .top-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .editor-toggle-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 18px; border-radius: 100px;
      border: 1px solid #ef444440; background: #ef444415;
      color: var(--red); font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: 'Inter', sans-serif;
      transition: all .15s;
    }
    .editor-toggle-btn:hover { background: #ef444425; }
    .editor-toggle-btn.active { background: var(--red); color: #fff; border-color: transparent; }

    /* Editor panel */
    .editor-panel { display: none; }
    .editor-panel.active { display: block; }
    .editor-hint { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.6; }
    .editor-list { display: flex; flex-direction: column; gap: 8px; }
    .editor-row {
      display: flex; align-items: center; gap: 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 16px; cursor: grab;
    }
    .editor-row.dragging { opacity: .35; }
    .editor-priority {
      width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
      background: var(--muted2); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800;
    }
    .editor-grip { color: var(--muted); font-size: 18px; line-height: 1; flex-shrink: 0; cursor: grab; }
    .editor-tag { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 5px 10px; border-radius: 100px; white-space: nowrap; flex-shrink: 0; }
    .editor-tag.ceo          { background: #f0f0f020; color: var(--text);   border: 1px solid #f0f0f040; }
    .editor-tag.ceo-shorts   { background: #14b8a620; color: var(--teal);   border: 1px solid #14b8a640; }
    .editor-tag.ivan-videos  { background: #a855f720; color: var(--purple); border: 1px solid #a855f740; }
    .editor-tag.ivan-lives   { background: #3b82f620; color: var(--blue);   border: 1px solid #3b82f640; }
    .editor-body { flex: 1; min-width: 0; }
    .editor-title { font-size: 14px; font-weight: 600; line-height: 1.35; margin-bottom: 3px; }
    .editor-meta { font-size: 12px; color: var(--muted); }
    .editor-empty { color: var(--muted); font-size: 13px; padding: 30px 0; text-align: center; }
    .editor-finish-btn {
      font-size: 11px; font-weight: 700; padding: 7px 14px; border-radius: 100px;
      border: 1px solid #14b8a640; background: #14b8a615; color: var(--teal);
      cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap; flex-shrink: 0;
      transition: background .15s;
    }
    .editor-finish-btn:hover { background: #14b8a630; }
    .editor-revert-btn {
      font-size: 11px; font-weight: 700; padding: 7px 14px; border-radius: 100px;
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap; flex-shrink: 0;
      transition: background .15s, color .15s;
    }
    .editor-revert-btn:hover { background: #f0f0f015; color: var(--text); }
    .editor-section-label {
      font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin: 32px 0 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .editor-section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    @media (max-width: 580px) {
      .editor-row { flex-wrap: wrap; }
      .editor-body { flex-basis: 100%; order: 1; }
    }
  </style>
</head>

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let currentChannel = 'ceo';

const statusMeta = {
  done:      { text: '✓ Publicado',  cls: 'done' },
  awaiting:  { text: '🕒 Aguardando publicação', cls: 'awaiting' },
  editing:   { text: '✂ Em edição', cls: 'editing' },
  scheduled: { text: '📅 Agendado',  cls: 'scheduled' },
  pending:   { text: '○ Pendente',   cls: 'pending' }
};

function saveStatus(chKey, pi, ii, status) {
  db.ref(`status/${chKey}/${pi}/${ii}`).set(status);
}

// Escuta mudanças em tempo real e re-renderiza
db.ref('status').on('value', snapshot => {
  const data = snapshot.val() || {};
  Object.entries(channels).forEach(([chKey, ch]) => {
    ch.phases.forEach((phase, pi) => {
      phase.items.forEach((item, ii) => {
        const saved = data?.[chKey]?.[pi]?.[ii];
        item.status = saved || item.status;
      });
    });
  });
  if (editorPanelOpen) { renderEditor(); renderAwaitingList(); }
  else render();
});

// ─────────────────────────────────────────────
// PAINEL DO EDITOR
// ─────────────────────────────────────────────
let editorPanelOpen = false;
let editorOrder = [];

const channelTagLabels = {
  'ceo': 'Diário de um CEO',
  'ceo-shorts': 'Diário de um CEO (Short)',
  'ivan-videos': 'Ivan Damha',
  'ivan-lives': 'Ivan Damha (Live)'
};

db.ref('editorOrder').on('value', snapshot => {
  editorOrder = snapshot.val() || [];
  if (editorPanelOpen) renderEditor();
});

function toggleEditorPanel() {
  editorPanelOpen = !editorPanelOpen;
  const btn = document.getElementById('editorToggleBtn');
  document.getElementById('channelBar').style.display = editorPanelOpen ? 'none' : '';
  document.getElementById('stats').style.display = editorPanelOpen ? 'none' : '';
  document.getElementById('grid').style.display = editorPanelOpen ? 'none' : '';
  document.getElementById('editorPanel').classList.toggle('active', editorPanelOpen);
  btn.classList.toggle('active', editorPanelOpen);
  btn.textContent = editorPanelOpen ? '← Voltar' : '🎬 Painel do Editor';
  if (editorPanelOpen) { renderEditor(); renderAwaitingList(); }
}

function getEditingItems() {
  const items = [];
  Object.entries(channels).forEach(([chKey, ch]) => {
    ch.phases.forEach((phase, pi) => {
      phase.items.forEach((item, ii) => {
        if (item.status === 'editing') {
          items.push({ key: `${chKey}__${pi}__${ii}`, chKey, pi, ii, item });
        }
      });
    });
  });
  items.sort((a, b) => {
    let ia = editorOrder.indexOf(a.key); if (ia === -1) ia = 9999;
    let ib = editorOrder.indexOf(b.key); if (ib === -1) ib = 9999;
    return ia - ib;
  });
  return items;
}

function getAwaitingItems() {
  const items = [];
  Object.entries(channels).forEach(([chKey, ch]) => {
    ch.phases.forEach((phase, pi) => {
      phase.items.forEach((item, ii) => {
        if (item.status === 'awaiting') {
          items.push({ chKey, pi, ii, item });
        }
      });
    });
  });
  return items;
}

function finishEditing(chKey, pi, ii) {
  channels[chKey].phases[pi].items[ii].status = 'awaiting';
  saveStatus(chKey, pi, ii, 'awaiting');
  renderEditor();
  renderAwaitingList();
}

function revertToEditing(chKey, pi, ii) {
  channels[chKey].phases[pi].items[ii].status = 'editing';
  saveStatus(chKey, pi, ii, 'editing');
  renderEditor();
  renderAwaitingList();
}

function renderEditor() {
  const list = document.getElementById('editorList');
  const items = getEditingItems();
  list.innerHTML = '';

  if (items.length === 0) {
    list.innerHTML = '<div class="editor-empty">Nenhum vídeo na fila de edição no momento.</div>';
    return;
  }

  items.forEach((it, idx) => {
    const row = document.createElement('div');
    row.className = 'editor-row';
    row.draggable = true;
    row.dataset.key = it.key;
    row.innerHTML = `
      <div class="editor-priority">${idx + 1}</div>
      <div class="editor-grip">⠿⠿</div>
      <span class="editor-tag ${it.chKey}">${channelTagLabels[it.chKey]}</span>
      <div class="editor-body">
        <div class="editor-title">${it.item.title}</div>
        <div class="editor-meta">📅 ${it.item.date}${it.item.notes ? ' · 📝 ' + it.item.notes : ''}</div>
      </div>
      <button class="editor-finish-btn" onclick="finishEditing('${it.chKey}',${it.pi},${it.ii})">✓ Edição finalizada</button>
    `;
    list.appendChild(row);
  });

  attachDragHandlers();
}

function renderAwaitingList() {
  const list = document.getElementById('awaitingList');
  const items = getAwaitingItems();
  list.innerHTML = '';

  if (items.length === 0) {
    list.innerHTML = '<div class="editor-empty">Nenhum vídeo aguardando publicação no momento.</div>';
    return;
  }

  items.forEach(it => {
    const row = document.createElement('div');
    row.className = 'editor-row';
    row.innerHTML = `
      <span class="editor-tag ${it.chKey}">${channelTagLabels[it.chKey]}</span>
      <div class="editor-body">
        <div class="editor-title">${it.item.title}</div>
        <div class="editor-meta">📅 ${it.item.date}</div>
      </div>
      <button class="editor-revert-btn" onclick="revertToEditing('${it.chKey}',${it.pi},${it.ii})">↩ Voltar para edição</button>
    `;
    list.appendChild(row);
  });
}

let dragSrc = null;

function attachDragHandlers() {
  const list = document.getElementById('editorList');
  list.querySelectorAll('.editor-row').forEach(row => {
    row.addEventListener('dragstart', () => {
      dragSrc = row;
      setTimeout(() => row.classList.add('dragging'), 0);
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      saveEditorOrder();
    });
  });

  list.addEventListener('dragover', e => {
    e.preventDefault();
    if (!dragSrc) return;
    const after = getDragAfterElement(list, e.clientY);
    if (after == null) list.appendChild(dragSrc);
    else list.insertBefore(dragSrc, after);
  });
}

function getDragAfterElement(container, y) {
  const els = [...container.querySelectorAll('.editor-row:not(.dragging)')];
  return els.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) return { offset, element: child };
    return closest;
  }, { offset: -Infinity }).element;
}

function saveEditorOrder() {
  const order = [...document.querySelectorAll('#editorList .editor-row')].map(r => r.dataset.key);
  document.querySelectorAll('#editorList .editor-priority').forEach((el, i) => el.textContent = i + 1);
  editorOrder = order;
  db.ref('editorOrder').set(order);
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function setChannel(key) {
  currentChannel = key;
  document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('active'));
  const map = { ceo: 0, 'ceo-shorts': 1, 'ivan-videos': 2, 'ivan-lives': 3 };
  document.querySelectorAll('.ch-btn')[map[key]].classList.add('active');
  render();
}

function render() {
  const ch = channels[currentChannel];
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  let done = 0, awaiting = 0, editing = 0, scheduled = 0, pending = 0;
  ch.phases.forEach(p => p.items.forEach(i => {
    if (i.status === 'done') done++;
    else if (i.status === 'awaiting') awaiting++;
    else if (i.status === 'editing') editing++;
    else if (i.status === 'scheduled') scheduled++;
    else pending++;
  }));
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-awaiting').textContent = awaiting;
  document.getElementById('s-editing').textContent = editing;
  document.getElementById('s-scheduled').textContent = scheduled;
  document.getElementById('s-pending').textContent = pending;

  ch.phases.forEach((phase, pi) => {
    const lbl = document.createElement('div');
    lbl.className = 'phase-label';
    lbl.textContent = phase.name;
    grid.appendChild(lbl);

    phase.items.forEach((item, ii) => {
      const sm = statusMeta[item.status];
      const card = document.createElement('div');
      card.className = `card ${item.status}`;

      const refsHtml = item.refs.length
        ? `<div class="detail-section">
            <div class="detail-label">Referências para assistir antes de gravar</div>
            <div class="ref-links">${item.refs.map(r => `<a class="ref-link" href="${r.u}" target="_blank">▶ ${r.l}</a>`).join('')}</div>
           </div>`
        : '';

      const notesHtml = item.notes
        ? `<div class="detail-section"><div class="detail-label">Notas</div><div class="detail-text">${item.notes}</div></div>`
        : '';

      const togglesHtml = Object.entries(statusMeta).map(([k, v]) =>
        `<button class="toggle-btn ${item.status === k ? 'active-' + k : ''}"
          onclick="changeStatus(event,'${currentChannel}',${pi},${ii},'${k}')">${v.text}</button>`
      ).join('');

      card.innerHTML = `
        <div class="week-num">${item.week}</div>
        <div class="card-body">
          <div class="card-category">${item.category}</div>
          <div class="card-title">${item.title}</div>
          <div class="card-meta">
            <div class="meta-item">📅 ${item.date}</div>
            ${item.notes ? `<div class="meta-item" style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📝 ${item.notes}</div>` : ''}
          </div>
          <div class="card-detail">
            ${refsHtml}
            ${notesHtml}
            <div class="detail-section">
              <div class="detail-label">Mudar status</div>
              <div class="status-toggle">${togglesHtml}</div>
            </div>
          </div>
        </div>
        <div class="card-right">
          <span class="badge ${sm.cls}">${sm.text}</span>
          <span class="pub-date">${item.date}</span>
        </div>
      `;

      card.addEventListener('click', function(e) {
        if (e.target.closest('.toggle-btn') || e.target.closest('.ref-link')) return;
        this.classList.toggle('open');
      });

      grid.appendChild(card);
    });
  });
}

function changeStatus(e, chKey, pi, ii, status) {
  e.stopPropagation();
  channels[chKey].phases[pi].items[ii].status = status;
  saveStatus(chKey, pi, ii, status);
  render();
  // Reabre o card correto
  const cards = document.querySelectorAll('.card');
  let count = 0;
  channels[chKey].phases.forEach((p, pii) => {
    p.items.forEach((_, iii) => {
      if (pii === pi && iii === ii) cards[count].classList.add('open');
      count++;
    });
  });
}

render();
</script>
